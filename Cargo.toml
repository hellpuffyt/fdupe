[package]
name = "fdupe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Prabesh Sharma"]
description = "Fast, safe duplicate file finder with a size/sample/hash cascade and a reviewable deletion workflow."
license = "MIT"
repository = "https://github.com/hellpuffyt/fdupe"
readme = "README.md"
keywords = ["duplicate", "files", "cli", "dedupe", "hash"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "fdupe"
path = "src/main.rs"

[lib]
name = "fdupe"
path = "src/lib.rs"

[dependencies]
clap = { version = "~4.5", features = ["derive"] }
walkdir = "2"
globset = "0.4"
same-file = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "~2.0"
predicates = "~3.1"

[profile.release]
opt-level = 3
lto = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
